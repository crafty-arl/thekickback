name = "kickback-sms"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[vars]
ENVIRONMENT = "production"

# Twilio credentials — set via `wrangler secret put`
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_MESSAGING_SERVICE_SID

# D1 database for venue/session state
# [[d1_databases]]
# binding = "DB"
# database_name = "kickback-sms"
# database_id = "<your-d1-id>"

# KV namespace for quick lookups (venue config, rate limits)
# [[kv_namespaces]]
# binding = "KV"
# id = "<your-kv-id>"
