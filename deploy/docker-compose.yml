services:
  caddy:
    image: caddy:alpine
    container_name: kickback-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      landing-blue:
        condition: service_healthy
      join-app:
        condition: service_healthy
      claw:
        condition: service_healthy
    restart: always
    networks:
      - kickback

  join-app:
    build:
      context: ../join-app
      dockerfile: Dockerfile
    container_name: join-app
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

  claw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: claw
    init: true
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=UTC
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - claw_config:/home/node/.openclaw
      - claw_workspace:/home/node/.openclaw/workspace
    expose:
      - "18789"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - kickback

  claw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: claw-cli
    network_mode: "service:claw"
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - BROWSER=echo
    volumes:
      - claw_config:/home/node/.openclaw
      - claw_workspace:/home/node/.openclaw/workspace
    depends_on:
      - claw
    stdin_open: true
    tty: true
    profiles:
      - cli

volumes:
  caddy_data:
  caddy_config:
  claw_config:
  claw_workspace:

networks:
  kickback:
    driver: bridge
