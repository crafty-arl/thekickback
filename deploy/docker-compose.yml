services:
  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    ports:
      - "3100:3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    ports:
      - "3101:3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

networks:
  kickback:
    driver: bridge
