services:
  caddy:
    image: caddy:alpine
    container_name: kickback-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      landing-blue:
        condition: service_healthy
    restart: always
    networks:
      - kickback

  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

volumes:
  caddy_data:
  caddy_config:

networks:
  kickback:
    driver: bridge
