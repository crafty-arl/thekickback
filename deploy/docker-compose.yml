services:
  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    ports:
      - "3100:3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    ports:
      - "3101:3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

networks:
  kickback:
    driver: bridge
