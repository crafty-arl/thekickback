services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      landing-blue:
        condition: service_healthy
    restart: always
    networks:
      - kickback

  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

networks:
  kickback:
    driver: bridge
