services:
  caddy:
    image: caddy:alpine
    container_name: kickback-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      landing-blue:
        condition: service_healthy
      join-app:
        condition: service_healthy
      dash-app:
        condition: service_healthy
      wallet-service:
        condition: service_started
        required: false
    restart: always
    networks:
      - kickback

  wallet-service:
    build:
      context: ../wallet-service
      dockerfile: Dockerfile
    container_name: wallet-service
    environment:
      - PORT=3003
      - SUPABASE_URL=https://wofvgfhejrvudvfxdytc.supabase.co
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PASS_TYPE_ID=pass.net.thekickback.venue
      - TEAM_ID=${APPLE_TEAM_ID}
      - SIGNER_KEY_PASSPHRASE=${SIGNER_KEY_PASSPHRASE}
    expose:
      - "3003"
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3003/wallet/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kickback

  join-app:
    build:
      context: ../join-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://wofvgfhejrvudvfxdytc.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rF_CWGfwxUwSXyFG_Zl56w_V_OfW_mQ
        NEXT_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoiY3JhZmZ0eWFybCIsImEiOiJjbW00bndseTIwZWNuMnFwdzF4Nm9oa2R5In0.IZmVHl0HZsz2fucPLUmfMQ
    container_name: join-app
    expose:
      - "3000"
    environment:
      - SUPABASE_URL=https://wofvgfhejrvudvfxdytc.supabase.co
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FOURSQUARE_SERVICE_TOKEN=${FOURSQUARE_SERVICE_TOKEN}
      - OPENCLAW_GATEWAY_URL=https://claw.thekickback.net
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_HOOKS_TOKEN=${OPENCLAW_HOOKS_TOKEN}
      - CAL_API_KEY=${CAL_API_KEY}
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  dash-app:
    build:
      context: ../dash-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://wofvgfhejrvudvfxdytc.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rF_CWGfwxUwSXyFG_Zl56w_V_OfW_mQ
    container_name: dash-app
    expose:
      - "3000"
    environment:
      - SUPABASE_URL=https://wofvgfhejrvudvfxdytc.supabase.co
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CAL_API_KEY=${CAL_API_KEY}
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-blue
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback

  landing-green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: landing-green
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kickback
    profiles:
      - deploy

  claw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: claw
    init: true
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=UTC
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FOURSQUARE_SERVICE_TOKEN=${FOURSQUARE_SERVICE_TOKEN}
    volumes:
      - claw_config:/home/node/.openclaw
      - claw_workspace:/home/node/.openclaw/workspace
      - ./openclaw-config/openclaw.json:/home/node/.openclaw/openclaw.json:ro
    expose:
      - "18789"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:18789/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - kickback

  claw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: claw-cli
    network_mode: "service:claw"
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - BROWSER=echo
    volumes:
      - claw_config:/home/node/.openclaw
      - claw_workspace:/home/node/.openclaw/workspace
    depends_on:
      - claw
    stdin_open: true
    tty: true
    profiles:
      - cli

volumes:
  caddy_data:
  caddy_config:
  claw_config:
  claw_workspace:


networks:
  kickback:
    driver: bridge
