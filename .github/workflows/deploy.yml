name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1. LINT & BUILD — gate for all downstream jobs
  # ═══════════════════════════════════════════════════════════
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # ═══════════════════════════════════════════════════════════
  # 2a. DEPLOY VPS — Docker containers (parallel with workers)
  # ═══════════════════════════════════════════════════════════
  deploy-vps:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APIDECK_APP_ID: ${{ secrets.APIDECK_APP_ID }}
          APIDECK_API_KEY: ${{ secrets.APIDECK_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CAL_API_KEY,STRIPE_SECRET_KEY,STRIPE_TEST_SECRET_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY,RESEND_API_KEY,APIDECK_APP_ID,APIDECK_API_KEY
          command_timeout: 10m
          script: |
            set -e
            cd /opt/thekickback
            git checkout -- . 2>/dev/null || true
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull origin main

            cd deploy
            grep -q '^CAL_API_KEY=' .env 2>/dev/null && sed -i "s|^CAL_API_KEY=.*|CAL_API_KEY=${CAL_API_KEY}|" .env || echo "CAL_API_KEY=${CAL_API_KEY}" >> .env
            grep -q '^STRIPE_SECRET_KEY=' .env 2>/dev/null && sed -i "s|^STRIPE_SECRET_KEY=.*|STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}|" .env || echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" >> .env
            grep -q '^STRIPE_TEST_SECRET_KEY=' .env 2>/dev/null && sed -i "s|^STRIPE_TEST_SECRET_KEY=.*|STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY}|" .env || echo "STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY}" >> .env
            grep -q '^NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=' .env 2>/dev/null && sed -i "s|^NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=.*|NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}|" .env || echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> .env
            grep -q '^NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY=' .env 2>/dev/null && sed -i "s|^NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY=.*|NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY}|" .env || echo "NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY}" >> .env
            sed -i '/^SMTP_/d' .env 2>/dev/null || true
            grep -q '^RESEND_API_KEY=' .env 2>/dev/null && sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=${RESEND_API_KEY}|" .env || echo "RESEND_API_KEY=${RESEND_API_KEY}" >> .env
            grep -q '^APIDECK_APP_ID=' .env 2>/dev/null && sed -i "s|^APIDECK_APP_ID=.*|APIDECK_APP_ID=${APIDECK_APP_ID}|" .env || echo "APIDECK_APP_ID=${APIDECK_APP_ID}" >> .env
            grep -q '^APIDECK_API_KEY=' .env 2>/dev/null && sed -i "s|^APIDECK_API_KEY=.*|APIDECK_API_KEY=${APIDECK_API_KEY}|" .env || echo "APIDECK_API_KEY=${APIDECK_API_KEY}" >> .env
            source .env

            # ── Cleanup ALL stale containers ──
            docker compose down --remove-orphans --timeout 5 2>/dev/null || true
            for C in landing-blue join-app dash-app wallet-service kickback-caddy claw; do
              docker rm -f "$C" 2>/dev/null || true
            done
            docker ps -aq | xargs -r docker rm -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            # ── Build all app images in parallel (BUILD_HASH busts SW cache) ──
            export BUILD_HASH=$(git rev-parse --short HEAD)
            echo "Building images (hash: $BUILD_HASH)..."
            docker compose build --parallel --build-arg BUILD_HASH=$BUILD_HASH landing-blue join-app dash-app wallet-service

            # ── Seed OpenClaw config into volume ──
            docker compose stop claw 2>/dev/null || true
            docker run --rm \
              -v deploy_claw_config:/config \
              -v "$(pwd)/openclaw-config/openclaw.json:/src/openclaw.json:ro" \
              alpine sh -c "cp /src/openclaw.json /config/openclaw.json && chown 1000:1000 /config/openclaw.json"
            echo "OpenClaw config seeded"

            # ── Start everything at once ──
            echo "Starting services..."
            docker compose up -d --force-recreate landing-blue join-app dash-app wallet-service claw

            # ── Wait for health — all in parallel ──
            echo "Waiting for health..."
            for SERVICE in landing-blue join-app dash-app wallet-service; do
              ( for i in $(seq 1 30); do
                  docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy" && break
                  sleep 2
                done
                echo "$SERVICE: $(docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null)" ) &
            done
            wait

            # ── OpenClaw: fix permissions + onboard ──
            sleep 10
            docker exec -u root claw sh -c "chown -R node:node /home/node/.openclaw && mkdir -p /home/node/.openclaw/agents /home/node/.openclaw/cron /home/node/.openclaw/logs && chown -R node:node /home/node/.openclaw" 2>/dev/null || true
            if ! docker exec claw cat /home/node/.openclaw/agents/main/agent/auth-profiles.json 2>/dev/null | grep -q openrouter; then
              echo "Onboarding OpenClaw with OpenRouter..."
              docker exec claw openclaw onboard --non-interactive --accept-risk \
                --auth-choice apiKey --token-provider openrouter \
                --token "${OPENROUTER_API_KEY}" \
                --anthropic-api-key "${OPENROUTER_API_KEY}" 2>&1 || true
              docker compose restart claw
              sleep 15
            fi

            # ── Caddy ──
            docker compose up -d --force-recreate caddy
            echo "VPS deploy complete"

  # ═══════════════════════════════════════════════════════════
  # 2b. DEPLOY WORKERS — Cloudflare (parallel with VPS)
  # ═══════════════════════════════════════════════════════════
  deploy-workers:
    needs: lint-and-build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── email-worker ──
      - name: Deploy email-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          secrets: |
            RESEND_API_KEY
            SUPABASE_SERVICE_KEY
            OPENCLAW_GATEWAY_TOKEN
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}

      # ── digest-worker ──
      - name: Deploy digest-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: digest-worker
          secrets: |
            SUPABASE_SERVICE_KEY
            RESEND_API_KEY
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # ── renewal-worker ──
      - name: Deploy renewal-worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: renewal-worker
          secrets: |
            SUPABASE_SERVICE_KEY
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ═══════════════════════════════════════════════════════════
  # 3. TEST — runs after VPS deploy succeeds
  #    (workers deploy runs independently, won't block tests)
  # ═══════════════════════════════════════════════════════════
  test-services:
    needs: [deploy-vps, deploy-workers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test all services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/thekickback/deploy
            source .env
            PASS=0; FAIL=0; WARN=0

            ok()   { PASS=$((PASS + 1)); echo "  ✓ $1"; }
            fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1"; }
            warn() { WARN=$((WARN + 1)); echo "  ⚠ $1"; }
            get_ip() { docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1" 2>/dev/null; }

            echo "═══ 1. CONTAINERS ═══"
            for PAIR in "landing-blue:3000:/health" "join-app:3000:/health" "dash-app:3000:/health" "wallet-service:3003:/wallet/health"; do
              C="${PAIR%%:*}"; REST="${PAIR#*:}"; P="${REST%%:*}"; EP="${REST#*:}"
              IP=$(get_ip "$C")
              [ -z "$IP" ] && { fail "$C — no IP"; continue; }
              CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 "http://$IP:$P$EP" 2>/dev/null)
              [ "$CODE" = "200" ] && ok "$C" || fail "$C — HTTP $CODE"
            done

            CLAW_IP=$(get_ip "claw")
            [ -n "$CLAW_IP" ] && curl -sf --max-time 5 "http://$CLAW_IP:18789/healthz" >/dev/null 2>&1 && ok "claw" || warn "claw — not ready"

            echo ""
            echo "═══ 2. PROXY ═══"
            sleep 3
            for D in thekickback.net join.thekickback.net dash.thekickback.net; do
              CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 -Lk -H "Host: $D" https://localhost/health 2>/dev/null)
              [ "$CODE" = "000" ] && CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 -H "Host: $D" http://localhost:80/health 2>/dev/null)
              [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "$D" || warn "$D — HTTP $CODE (Caddy may need TLS warmup)"
            done

            echo ""
            echo "═══ 3. DATABASE ═══"
            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 "${SUPABASE_URL}/rest/v1/venues?select=id&limit=1" -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null)
            [ "$CODE" = "200" ] && ok "Supabase" || fail "Supabase — HTTP $CODE"

            echo ""
            echo "═══ 4. AI AGENT ═══"
            if [ -n "$CLAW_IP" ]; then
              for i in $(seq 1 9); do
                S=$(docker inspect claw --format '{{.State.Health.Status}}' 2>/dev/null)
                [ "$S" = "healthy" ] && break
                sleep 5
              done

              if [ "$S" = "healthy" ]; then
                RESP=$(curl -sf --max-time 60 "http://$CLAW_IP:18789/v1/responses" -X POST \
                  -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -H "x-openclaw-agent-id: main" \
                  -d '{"model":"openclaw","input":"Say OK"}' 2>/dev/null)

                if echo "$RESP" | grep -q "output_text"; then
                  TEXT=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); m=[o for o in d.get('output',[]) if o.get('type')=='message']; print(m[0]['content'][0]['text'][:60] if m else '?')" 2>/dev/null)
                  ok "AI → $TEXT"
                elif echo "$RESP" | grep -q "error"; then
                  ERR=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message','?')[:80])" 2>/dev/null)
                  fail "AI error: $ERR"
                else
                  warn "AI — unexpected response"
                fi
              else
                warn "claw not healthy"
              fi
            else
              warn "claw not running"
            fi

            echo ""
            echo "═══ 4b. POS AI CLASSIFIER ═══"
            if [ -n "$CLAW_IP" ] && [ "$S" = "healthy" ]; then
              CLASSIFY_RESP=$(curl -sf --max-time 30 "http://$CLAW_IP:18789/v1/responses" -X POST \
                -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "x-openclaw-agent-id: pos-classifier" \
                -d '{"model":"openrouter/anthropic/claude-haiku-4-5-20251001","input":"You are classifying menu items for a cafe.\nFor each item assign ONE type from: product, service, event, reservation, membership, package\n\nItems:\n1. \"Night Owl Blend\" — Dark roast coffee\n2. \"Latte Art Workshop\" — Learn to pour latte art, 90 min\n3. \"Monthly Coffee Pass\" — One free drip per day for 30 days\n4. \"Study Room\" — Private room rental, 2 hours\n5. \"Birthday Package\" — Table + cake + drinks for 10\n\nRespond with ONLY JSON: {\"1\":\"type\",\"2\":\"type\",...}"}' 2>/dev/null)

              if echo "$CLASSIFY_RESP" | grep -q "output_text"; then
                TEXT=$(echo "$CLASSIFY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); m=[o for o in d.get('output',[]) if o.get('type')=='message']; t=m[0]['content'][0]['text'] if m else d.get('output_text',''); print(t[:200])" 2>/dev/null)
                if echo "$TEXT" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert d.get('1')=='product'; assert d.get('2') in ('service','event'); assert d.get('3')=='membership'; print('Classifications correct')" 2>/dev/null; then
                  ok "POS classifier → $TEXT"
                else
                  warn "POS classifier — unexpected types: $TEXT"
                fi
              else
                warn "POS classifier — no response"
              fi
            else
              warn "POS classifier — skipped (claw not ready)"
            fi

            echo ""
            echo "═══ 5. CHAT END-TO-END ═══"
            JOIN_IP=$(get_ip "join-app")
            VID=$(curl -sf --max-time 5 "${SUPABASE_URL}/rest/v1/venues?select=id&state=eq.active&limit=1" -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" 2>/dev/null)
            if [ -n "$JOIN_IP" ] && [ -n "$VID" ] && [ -n "$CLAW_IP" ]; then
              CR=$(curl -sf --max-time 60 "http://$JOIN_IP:3000/api/chat" -X POST -H "Content-Type: application/json" -d "{\"message\":\"hello\",\"venueId\":\"$VID\",\"venueName\":\"Test\",\"vibe\":\"quiet\",\"occupancy\":5}" 2>/dev/null)
              if echo "$CR" | grep -q "reply"; then
                R=$(echo "$CR" | python3 -c "import sys,json; print(json.load(sys.stdin).get('reply','')[:60])" 2>/dev/null)
                ok "Chat → $R"
              else
                warn "Chat — no reply"
              fi
            else
              warn "Chat — skipped (missing deps)"
            fi

            echo ""
            echo "═══ 6. CLOUDFLARE WORKERS ═══"
            for WORKER in kickback-email kickback-digest kickback-renewal; do
              CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 "https://${WORKER}.carl-lewis.workers.dev/health" 2>/dev/null)
              if [ "$CODE" = "200" ]; then
                BODY=$(curl -sf --max-time 5 "https://${WORKER}.carl-lewis.workers.dev/health" 2>/dev/null)
                ok "$WORKER → $BODY"
              else
                warn "$WORKER — HTTP $CODE"
              fi
            done

            echo ""
            echo "═══ 7. EMAIL DELIVERY TEST ═══"
            DEPLOY_TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            EMAIL_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 15 \
              "https://kickback-email.carl-lewis.workers.dev/send" \
              -X POST -H "Content-Type: application/json" \
              -d "{\"to\":\"carl@craftthefuture.xyz\",\"subject\":\"[Deploy] ${DEPLOY_TS} — All services healthy\",\"html\":\"<div style='font-family:system-ui;background:#000;color:#fff;padding:32px;border-radius:16px;'><h2 style='color:#F97316;margin:0 0 12px;'>Deploy Successful</h2><p style='color:rgba(255,255,255,0.6);margin:0 0 8px;'>All services passed health checks at ${DEPLOY_TS}.</p><p style='color:rgba(255,255,255,0.3);font-size:13px;margin:0;'>Passed: $PASS | Failed: $FAIL | Warnings: $WARN</p></div>\",\"text\":\"Deploy passed at ${DEPLOY_TS}. Passed: $PASS, Failed: $FAIL, Warnings: $WARN\"}" 2>/dev/null)
            [ "$EMAIL_CODE" = "200" ] && ok "Deploy report emailed to carl@craftthefuture.xyz" || warn "Email send — HTTP $EMAIL_CODE"

            echo ""
            echo "═══ RESULTS: $PASS passed, $FAIL failed, $WARN warnings ═══"
            [ $FAIL -gt 0 ] && { echo "FAILED"; exit 1; }
            echo "All critical tests passed"

      - name: Test sandbox isolation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/thekickback/deploy
            source .env
            PASS=0; FAIL=0; WARN=0

            ok()   { PASS=$((PASS + 1)); echo "  ✓ $1"; }
            fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1"; }
            warn() { WARN=$((WARN + 1)); echo "  ⚠ $1"; }

            echo "═══ SANDBOX DOMAIN ROUTING ═══"
            for D in sandbox.thekickback.net sanddash.thekickback.net; do
              CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 -Lk -H "Host: $D" https://localhost/health 2>/dev/null)
              [ "$CODE" = "000" ] && CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 -H "Host: $D" http://localhost:80/health 2>/dev/null)
              [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "$D responds" || warn "$D — HTTP $CODE (Caddy TLS warmup)"
            done

            echo ""
            echo "═══ SANDBOX vs PRODUCTION — API ISOLATION ═══"
            JOIN_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' join-app 2>/dev/null)
            DASH_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' dash-app 2>/dev/null)

            if [ -n "$JOIN_IP" ]; then
              PROD_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$JOIN_IP:3000/api/wallet" \
                -H "Host: join.thekickback.net" 2>/dev/null)
              SAND_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$JOIN_IP:3000/api/wallet" \
                -H "Host: sandbox.thekickback.net" 2>/dev/null)

              [ "$PROD_CODE" = "401" ] || [ "$PROD_CODE" = "200" ] && ok "join prod wallet API ($PROD_CODE)" || fail "join prod wallet — HTTP $PROD_CODE"
              [ "$SAND_CODE" = "401" ] || [ "$SAND_CODE" = "200" ] && ok "join sandbox wallet API ($SAND_CODE)" || fail "join sandbox wallet — HTTP $SAND_CODE"
            else
              fail "join-app not running"
            fi

            if [ -n "$DASH_IP" ]; then
              PROD_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$DASH_IP:3000/health" \
                -H "Host: dash.thekickback.net" 2>/dev/null)
              SAND_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$DASH_IP:3000/health" \
                -H "Host: sanddash.thekickback.net" 2>/dev/null)

              [ "$PROD_CODE" = "200" ] && ok "dash prod health ($PROD_CODE)" || fail "dash prod — HTTP $PROD_CODE"
              [ "$SAND_CODE" = "200" ] && ok "dash sandbox health ($SAND_CODE)" || fail "dash sandbox — HTTP $SAND_CODE"

              SEED_PROD=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$DASH_IP:3000/api/seed-demo" \
                -X POST -H "Host: dash.thekickback.net" 2>/dev/null)
              [ "$SEED_PROD" = "403" ] && ok "seed-demo blocked on production ($SEED_PROD)" || warn "seed-demo on prod — HTTP $SEED_PROD (expected 403)"

              SEED_SAND=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "http://$DASH_IP:3000/api/seed-demo" \
                -X POST -H "Host: sanddash.thekickback.net" 2>/dev/null)
              [ "$SEED_SAND" != "403" ] && ok "seed-demo allowed on sandbox ($SEED_SAND)" || fail "seed-demo blocked on sandbox — HTTP $SEED_SAND"
            else
              fail "dash-app not running"
            fi

            echo ""
            echo "═══ SANDBOX RESULTS: $PASS passed, $FAIL failed, $WARN warnings ═══"
            [ $FAIL -gt 0 ] && { echo "SANDBOX TESTS FAILED"; exit 1; }
            echo "All sandbox isolation tests passed"

      - name: Test production domains
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/thekickback/deploy
            source .env
            PASS=0; FAIL=0; WARN=0

            ok()   { PASS=$((PASS + 1)); echo "  ✓ $1"; }
            fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1"; }
            warn() { WARN=$((WARN + 1)); echo "  ⚠ $1"; }

            echo "═══ PRODUCTION DOMAIN VERIFICATION ═══"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: thekickback.net" https://localhost/ 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "thekickback.net landing" || warn "thekickback.net — HTTP $CODE"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: join.thekickback.net" https://localhost/health 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "join.thekickback.net health" || warn "join.thekickback.net — HTTP $CODE"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: dash.thekickback.net" https://localhost/health 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "dash.thekickback.net health" || warn "dash.thekickback.net — HTTP $CODE"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: thekickback.net" https://localhost/wallet/health 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "wallet-service health" || warn "wallet-service — HTTP $CODE"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: sandbox.thekickback.net" https://localhost/health 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "sandbox.thekickback.net health" || warn "sandbox.thekickback.net — HTTP $CODE"

            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 10 -Lk -H "Host: sanddash.thekickback.net" https://localhost/health 2>/dev/null)
            [ "$CODE" = "200" ] || [ "$CODE" = "308" ] && ok "sanddash.thekickback.net health" || warn "sanddash.thekickback.net — HTTP $CODE"

            echo ""
            echo "═══ PRODUCTION DB — SHARED INSTANCE VERIFICATION ═══"
            VID=$(curl -sf --max-time 5 \
              "${SUPABASE_URL}/rest/v1/venues?select=id&state=eq.active&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')" 2>/dev/null)

            if [ -n "$VID" ]; then
              ok "Active venue found: ${VID:0:8}..."

              JOIN_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' join-app 2>/dev/null)
              if [ -n "$JOIN_IP" ]; then
                PROD_VEN=$(curl -sf --max-time 10 "http://$JOIN_IP:3000/api/venue-page?venueId=$VID" \
                  -H "Host: join.thekickback.net" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('venue',{}).get('id',''))" 2>/dev/null)
                SAND_VEN=$(curl -sf --max-time 10 "http://$JOIN_IP:3000/api/venue-page?venueId=$VID" \
                  -H "Host: sandbox.thekickback.net" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('venue',{}).get('id',''))" 2>/dev/null)

                [ "$PROD_VEN" = "$VID" ] && ok "Prod sees venue $VID" || warn "Prod venue lookup — got '$PROD_VEN'"
                [ "$SAND_VEN" = "$VID" ] && ok "Sandbox sees same venue $VID" || warn "Sandbox venue lookup — got '$SAND_VEN'"
              fi
            else
              warn "No active venues in database"
            fi

            echo ""
            echo "═══ PRODUCTION RESULTS: $PASS passed, $FAIL failed, $WARN warnings ═══"
            [ $FAIL -gt 0 ] && { echo "PRODUCTION TESTS FAILED"; exit 1; }
            echo "All production domain tests passed"
