name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CAL_API_KEY
          command_timeout: 10m
          script: |
            cd /opt/thekickback
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull origin main

            # Ensure CAL_API_KEY is in .env
            cd deploy
            grep -q '^CAL_API_KEY=' .env 2>/dev/null && sed -i "s|^CAL_API_KEY=.*|CAL_API_KEY=${CAL_API_KEY}|" .env || echo "CAL_API_KEY=${CAL_API_KEY}" >> .env

            # Run pending Cal.com migration (idempotent)
            source .env
            curl -sf -X POST "https://wofvgfhejrvudvfxdytc.supabase.co/rest/v1/rpc/exec_sql" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"query":"ALTER TABLE venue_offerings ADD COLUMN IF NOT EXISTS cal_event_type_id integer; ALTER TABLE venues ADD COLUMN IF NOT EXISTS cal_api_key text;"}' \
              2>/dev/null || echo "Note: migration may need manual run via Supabase SQL Editor"

            # Clean up only orphan containers (don't take down running services)
            docker container prune -f 2>/dev/null || true

            # Rebuild and restart only app services (Caddy stays up)
            docker compose build --no-cache landing-blue
            docker compose up -d --build landing-blue join-app dash-app

            # Wait for all app services to be healthy
            echo "Waiting for health checks..."
            for SERVICE in landing-blue join-app dash-app; do
              RETRIES=30
              until docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; do
                RETRIES=$((RETRIES - 1))
                if [ $RETRIES -le 0 ]; then
                  echo "FAIL: $SERVICE health check never passed"
                  docker logs $SERVICE --tail 20
                  exit 1
                fi
                sleep 2
              done
              echo "$SERVICE is healthy"
            done

            # Reload Caddy config without restarting (zero-downtime)
            docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || docker compose restart caddy

            echo "Deploy verified: all services healthy"

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/thekickback/deploy

            # Verify containers directly (avoids Cloudflare hairpin/DNS issues)
            for PAIR in "landing-blue:3000" "join-app:3000" "dash-app:3000"; do
              CONTAINER="${PAIR%%:*}"
              PORT="${PAIR##*:}"
              IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER" 2>/dev/null)
              if [ -z "$IP" ]; then
                echo "FAIL: $CONTAINER has no IP"
                exit 1
              fi
              HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 "http://$IP:$PORT/health")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "FAIL: $CONTAINER returned HTTP $HTTP_CODE"
                docker logs "$CONTAINER" --tail 10
                exit 1
              fi
              echo "$CONTAINER — HTTP 200"
            done

            # Also verify Caddy is proxying correctly via localhost
            for DOMAIN in thekickback.net join.thekickback.net dash.thekickback.net; do
              HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 -H "Host: $DOMAIN" http://localhost/health)
              if [ "$HTTP_CODE" != "200" ]; then
                echo "WARN: Caddy proxy for $DOMAIN returned HTTP $HTTP_CODE (may need TLS warmup)"
              else
                echo "Caddy → $DOMAIN — HTTP 200"
              fi
            done

            echo "All services verified"
