name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/thekickback
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull origin main

            # First deploy — just rebuild blue
            cd deploy
            docker compose up -d --build landing-blue

            # Wait for healthy
            echo "Waiting for health check..."
            RETRIES=30
            until docker inspect landing-blue --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; do
              RETRIES=$((RETRIES - 1))
              if [ $RETRIES -le 0 ]; then
                echo "FAIL: health check never passed"
                exit 1
              fi
              sleep 2
            done
            echo "Deploy verified: landing-blue is healthy"

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" https://thekickback.net/health)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "DEPLOY VERIFICATION FAILED: HTTP $HTTP_CODE"
              exit 1
            fi
            echo "Landing page live — HTTP 200"
