name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/thekickback
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull origin main

            # Clean up orphan containers from previous failed deploys
            cd deploy
            docker compose down --remove-orphans 2>/dev/null || true
            docker container prune -f 2>/dev/null || true

            # Rebuild all app services + restart Caddy
            docker compose build --no-cache landing-blue
            docker compose up -d --build landing-blue join-app dash-app
            docker compose restart caddy

            # Wait for all services to be healthy
            echo "Waiting for health checks..."
            for SERVICE in landing-blue join-app dash-app; do
              RETRIES=30
              until docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; do
                RETRIES=$((RETRIES - 1))
                if [ $RETRIES -le 0 ]; then
                  echo "FAIL: $SERVICE health check never passed"
                  docker logs $SERVICE --tail 20
                  exit 1
                fi
                sleep 2
              done
              echo "$SERVICE is healthy"
            done
            echo "Deploy verified: all services healthy"

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            for URL in https://thekickback.net/health https://join.thekickback.net/health https://dash.thekickback.net/health; do
              HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" "$URL")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "DEPLOY VERIFICATION FAILED: $URL returned HTTP $HTTP_CODE"
                exit 1
              fi
              echo "$URL — HTTP 200"
            done
            echo "All services live"
