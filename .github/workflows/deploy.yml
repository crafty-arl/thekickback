name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CAL_API_KEY
          command_timeout: 10m
          script: |
            cd /opt/thekickback
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull origin main

            # Ensure CAL_API_KEY is in .env
            cd deploy
            grep -q '^CAL_API_KEY=' .env 2>/dev/null && sed -i "s|^CAL_API_KEY=.*|CAL_API_KEY=${CAL_API_KEY}|" .env || echo "CAL_API_KEY=${CAL_API_KEY}" >> .env

            # Run pending Cal.com migration (idempotent)
            source .env
            curl -sf -X POST "https://wofvgfhejrvudvfxdytc.supabase.co/rest/v1/rpc/exec_sql" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"query":"ALTER TABLE venue_offerings ADD COLUMN IF NOT EXISTS cal_event_type_id integer; ALTER TABLE venues ADD COLUMN IF NOT EXISTS cal_api_key text;"}' \
              2>/dev/null || echo "Note: migration may need manual run via Supabase SQL Editor"

            # Clean up dead containers, old images, and build cache
            docker container prune -f 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true

            # ── Build & deploy all app services ──
            docker compose build --no-cache landing-blue join-app dash-app wallet-service
            docker compose up -d --force-recreate landing-blue join-app dash-app wallet-service

            # Wait for app services to be healthy
            echo "Waiting for app health checks..."
            for SERVICE in landing-blue join-app dash-app wallet-service; do
              RETRIES=30
              until docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; do
                RETRIES=$((RETRIES - 1))
                if [ $RETRIES -le 0 ]; then
                  echo "WARN: $SERVICE health check timed out"
                  docker logs $SERVICE --tail 10
                  break
                fi
                sleep 2
              done
              echo "$SERVICE: $(docker inspect $SERVICE --format '{{.State.Health.Status}}' 2>/dev/null || echo 'no healthcheck')"
            done

            # ── OpenClaw agent gateway ──
            docker compose up -d claw
            sleep 15

            # Ensure claw has correct permissions
            docker exec -u root claw chown -R node:node /home/node/.openclaw/ 2>/dev/null || true

            # Onboard with OpenRouter if not already configured
            source .env
            if ! docker exec claw cat /home/node/.openclaw/agents/main/agent/auth-profiles.json 2>/dev/null | grep -q openrouter; then
              echo "Onboarding OpenClaw with OpenRouter..."
              docker exec claw openclaw onboard --non-interactive --accept-risk \
                --auth-choice apiKey --token-provider openrouter \
                --token "${OPENROUTER_API_KEY}" \
                --anthropic-api-key "${OPENROUTER_API_KEY}" 2>&1 || echo "Onboard warning (may already be configured)"
              docker compose restart claw
              sleep 15
            fi
            echo "OpenClaw: $(docker inspect claw --format '{{.State.Health.Status}}' 2>/dev/null || echo 'starting')"

            # ── Caddy reverse proxy (depends on all services) ──
            docker compose up -d --force-recreate caddy
            sleep 5

            # Verify Caddy is running
            if ! docker inspect kickback-caddy --format '{{.State.Status}}' 2>/dev/null | grep -q "running"; then
              echo "FAIL: Caddy is not running"
              docker logs kickback-caddy --tail 20 2>&1 || true
              exit 1
            fi
            echo "Caddy is running"

            echo "Deploy complete"

      - name: Test all services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/thekickback/deploy
            source .env
            PASS=0
            FAIL=0
            WARN=0

            ok()   { PASS=$((PASS + 1)); echo "  ✓ $1"; }
            fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1"; }
            warn() { WARN=$((WARN + 1)); echo "  ⚠ $1"; }

            get_ip() { docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1" 2>/dev/null; }

            # ═══════════════════════════════════════════
            echo "═══ 1. CONTAINER HEALTH ═══"
            # ═══════════════════════════════════════════
            for PAIR in "landing-blue:3000:/health" "join-app:3000:/health" "dash-app:3000:/health" "wallet-service:3003:/wallet/health"; do
              CONTAINER="${PAIR%%:*}"
              REST="${PAIR#*:}"
              PORT="${REST%%:*}"
              PATH="${REST#*:}"
              IP=$(get_ip "$CONTAINER")
              if [ -z "$IP" ]; then
                fail "$CONTAINER — no container IP"
                continue
              fi
              HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 "http://$IP:$PORT$PATH" 2>/dev/null)
              if [ "$HTTP_CODE" = "200" ]; then
                ok "$CONTAINER — HTTP 200 ($IP:$PORT$PATH)"
              else
                fail "$CONTAINER — HTTP $HTTP_CODE"
                docker logs "$CONTAINER" --tail 5 2>&1 || true
              fi
            done

            # Claw container
            CLAW_IP=$(get_ip "claw")
            if [ -n "$CLAW_IP" ]; then
              CLAW_HEALTH=$(curl -sf --max-time 5 "http://$CLAW_IP:18789/healthz" 2>/dev/null)
              if echo "$CLAW_HEALTH" | grep -q '"ok":true'; then
                ok "claw — healthy ($CLAW_IP:18789)"
              else
                warn "claw — not healthy yet"
              fi
            else
              warn "claw — no container IP"
            fi

            # ═══════════════════════════════════════════
            echo ""
            echo "═══ 2. CADDY REVERSE PROXY ═══"
            # ═══════════════════════════════════════════
            for DOMAIN in thekickback.net join.thekickback.net dash.thekickback.net; do
              HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 -Lk -H "Host: $DOMAIN" https://localhost/health 2>/dev/null)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "308" ]; then
                ok "Caddy → $DOMAIN (HTTP $HTTP_CODE)"
              else
                fail "Caddy → $DOMAIN (HTTP $HTTP_CODE)"
              fi
            done

            # Wallet via Caddy
            WALLET_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 -Lk -H "Host: thekickback.net" https://localhost/wallet/health 2>/dev/null)
            if [ "$WALLET_CODE" = "200" ]; then
              ok "Caddy → wallet (HTTP $WALLET_CODE)"
            else
              warn "Caddy → wallet (HTTP $WALLET_CODE)"
            fi

            # ═══════════════════════════════════════════
            echo ""
            echo "═══ 3. SUPABASE CONNECTIVITY ═══"
            # ═══════════════════════════════════════════
            JOIN_IP=$(get_ip "join-app")
            if [ -n "$JOIN_IP" ]; then
              # Test that join-app can reach Supabase (venues query)
              VENUES=$(curl -sf --max-time 10 "http://$JOIN_IP:3000/api/points?userId=test" 2>/dev/null)
              if echo "$VENUES" | grep -q "balance\|error"; then
                ok "join-app → Supabase (API responding)"
              else
                warn "join-app → Supabase (unexpected response)"
              fi
            fi

            # Direct Supabase test
            SB_CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 \
              "${SUPABASE_URL}/rest/v1/venues?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null)
            if [ "$SB_CODE" = "200" ]; then
              ok "Supabase direct — HTTP 200"
            else
              fail "Supabase direct — HTTP $SB_CODE"
            fi

            # ═══════════════════════════════════════════
            echo ""
            echo "═══ 4. AI AGENT (OpenClaw → OpenRouter) ═══"
            # ═══════════════════════════════════════════
            if [ -n "$CLAW_IP" ]; then
              # Wait for claw to be fully ready
              RETRIES=12
              while [ $RETRIES -gt 0 ]; do
                STATUS=$(docker inspect claw --format '{{.State.Health.Status}}' 2>/dev/null || echo "none")
                [ "$STATUS" = "healthy" ] && break
                RETRIES=$((RETRIES - 1))
                sleep 5
              done

              if [ "$STATUS" = "healthy" ]; then
                # Send real AI request
                AI_RESP=$(curl -sf --max-time 60 "http://$CLAW_IP:18789/v1/responses" \
                  -X POST \
                  -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -H "x-openclaw-agent-id: main" \
                  -d '{"model":"openclaw","input":"Respond with exactly one word: KICKBACK"}' 2>/dev/null)

                if echo "$AI_RESP" | grep -q "output_text"; then
                  AI_TEXT=$(echo "$AI_RESP" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  msgs=[o for o in d.get('output',[]) if o.get('type')=='message']
  print(msgs[0]['content'][0]['text'][:80] if msgs else 'empty')
except: print('parse_error')" 2>/dev/null)
                  ok "AI agent responding — said: $AI_TEXT"
                elif echo "$AI_RESP" | grep -q "failed\|error"; then
                  ERROR=$(echo "$AI_RESP" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print(d.get('error',{}).get('message','unknown')[:100])
except: print('parse_error')" 2>/dev/null)
                  fail "AI agent error: $ERROR"
                  docker logs claw --tail 5 2>&1 || true
                else
                  warn "AI agent — unexpected response"
                  echo "    $(echo "$AI_RESP" | head -c 200)"
                fi
              else
                warn "claw not healthy after 60s — status: $STATUS"
                docker logs claw --tail 10 2>&1 || true
              fi
            else
              warn "claw container not running — skipping AI test"
            fi

            # ═══════════════════════════════════════════
            echo ""
            echo "═══ 5. CHAT API END-TO-END ═══"
            # ═══════════════════════════════════════════
            if [ -n "$JOIN_IP" ] && [ -n "$CLAW_IP" ]; then
              # Get a real venue ID
              VENUE_ID=$(curl -sf --max-time 5 \
                "${SUPABASE_URL}/rest/v1/venues?select=id&state=eq.active&limit=1" \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null \
                | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" 2>/dev/null)

              if [ -n "$VENUE_ID" ]; then
                CHAT_RESP=$(curl -sf --max-time 60 "http://$JOIN_IP:3000/api/chat" \
                  -X POST \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"hello\",\"venueId\":\"$VENUE_ID\",\"venueName\":\"Test\",\"vibe\":\"quiet\",\"occupancy\":5}" 2>/dev/null)

                if echo "$CHAT_RESP" | grep -q "reply"; then
                  REPLY=$(echo "$CHAT_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('reply','')[:80])" 2>/dev/null)
                  ok "Chat API → AI → response: $REPLY"
                else
                  warn "Chat API — no reply field"
                  echo "    $(echo "$CHAT_RESP" | head -c 200)"
                fi
              else
                warn "No active venues found for chat test"
              fi
            else
              warn "Skipping chat test — missing containers"
            fi

            # ═══════════════════════════════════════════
            echo ""
            echo "═══ RESULTS ═══"
            echo "  Passed: $PASS"
            echo "  Failed: $FAIL"
            echo "  Warnings: $WARN"
            # ═══════════════════════════════════════════

            if [ $FAIL -gt 0 ]; then
              echo ""
              echo "DEPLOY VERIFICATION FAILED — $FAIL test(s) failed"
              exit 1
            fi

            echo ""
            echo "All critical tests passed"
